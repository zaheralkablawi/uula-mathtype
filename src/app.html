<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>UULA MathType Code</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#18212e;--muted:#5d6878;--line:#d9dfe7;--accent:#1f71de;--accent-soft:#e7effc;--ok:#1f9d55;--warn:#e8590c;--bad:#d62f2f;
  --f:"UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
button{font-family:inherit}
.wrap{padding:10px 14px 16px;display:grid;gap:10px}
header{display:flex;align-items:center;gap:8px;direction:rtl;padding-inline:13px}
h1{margin:0;display:flex;align-items:center;gap:7px;font-weight:500;direction:ltr;margin-left:auto}
h1 .bt{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;height:30px}
h1 .root{color:#2072e0;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
h1 .sub{color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ib.updbtn{position:relative;color:#e8590c;border-color:#e8590c}
.updbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:#e8590c;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{50%{transform:scale(1.5);opacity:.5}}
.appmenu{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);padding:5px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;font-size:12.5px;text-align:start;background:none;border:0;border-radius:7px;padding:6px 10px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.menu svg{width:15px;height:15px;flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-size:12.5px;height:26px;border:0;border-inline-start:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;padding:0 4px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.go:hover{filter:brightness(1.07)}.go:disabled{opacity:.55;cursor:default}
.go.alt{background:var(--panel);color:var(--accent);border:1.5px solid var(--accent)}
.go.alt:hover{background:var(--accent-soft);filter:none}
.go.alt .spin{border-color:rgb(31 113 222 / .3);border-top-color:var(--accent)}
.go .num{font-size:15px;font-weight:600;line-height:1}
.sep{height:1px;background:var(--line);margin:2px 0}
.note{font-size:11.8px;color:var(--muted);text-align:center;margin-top:-4px}
.go svg{width:18px;height:18px}
.status{font-size:12.8px;color:var(--muted);min-height:1.2em;text-align:center}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{font-size:11.8px;border-radius:20px;padding:1px 9px;background:#eef1f5;color:var(--muted)}
.pill.ok{background:#e4f5ea;color:var(--ok)}.pill.warn{background:#fdeee4;color:var(--warn)}.pill.bad{background:#fbe5e5;color:var(--bad)}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .ic{width:18px;height:18px;margin-top:2px}
.row .code{font-size:13px;white-space:pre-wrap;word-break:break-word;direction:rtl;unicode-bidi:plaintext}
.row .meta{font-size:11px;color:var(--muted)}
.row .note{font-size:11.5px;color:var(--warn)}
.row.ok .ic{color:var(--ok)}.row.warn .ic{color:var(--warn)}.row.bad .ic{color:var(--bad)}.row.skip .ic{color:#9aa3b0}
.mini{font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:6px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.mini.del{color:var(--bad)}
.hint{font-size:11.8px;color:var(--muted);text-align:center;line-height:1.7}
.hint b{color:var(--ink);font-weight:600}
.modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 40px rgb(0 0 0 / .3)}
.mbox h3{margin:0 0 8px;font-size:1rem}.mbox p{margin:6px 0;font-size:13px}
.mbox .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.credit{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 0}
.spin{width:16px;height:16px;border:2px solid rgb(255 255 255 / .45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
  <header>
    <h1><img src="logo.png" alt="" width="30" height="30" style="display:block;flex:none"><span class="bt"><span class="root">UULA</span><span class="sub">MathType Code</span></span></h1>
    <button type="button" class="ib updbtn" id="updBtn" hidden title="تحديث جديد"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"/><path d="M20 20v-5h-5"/></svg><span class="dot"></span></button>
    <div class="appmenu">
      <button type="button" class="ib" id="menuBtn" aria-expanded="false" title="القائمة"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" hidden>
        <button type="button" id="chkUpd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"/><path d="M20 20v-5h-5"/></svg>التحقق من التحديثات</button>
        <button type="button" id="aboutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>حول الأداة</button>
      </div>
    </div>
  </header>

  <div class="panel">
    <div class="label">النطاق</div>
    <div class="seg" id="scope">
      <button type="button" data-v="sel">المحدد</button>
      <button type="button" data-v="slide" aria-pressed="true">الشريحة</button>
      <button type="button" data-v="all">كل الملف</button>
    </div>
    <label class="chk"><input type="checkbox" id="redo"> استبدل الكود إذا كان موجودًا من قبل</label>
    <button type="button" class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg><span id="goTxt">إضافة الكود</span></button>
    <div class="sep"></div>
    <button type="button" class="go alt" id="digits"><span class="num">١٢٣</span><span id="digTxt">تحويل الأرقام إلى هندية</span></button>
    <button type="button" class="go alt" id="parens"><span class="num">( )</span><span id="parTxt">إصلاح الأقواس المعكوسة</span></button>
    <div class="note">نص الشرائح فقط، بدون رقم الصفحة والقالب والخلفية.</div>
  </div>

  <div class="status" id="status" role="status"></div>
  <div class="sum" id="sum"></div>
  <div class="list" id="list"></div>
  <div class="hint" id="hint">بعد إضافة الكود: حدد المعادلة القديمة، ثم اضغط <b>تعديل</b> في <b>UULA Arabic Math</b>، ثم <b>إدراج</b>.</div>

  <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="mini" id="modalOk" hidden>متابعة</button><button type="button" class="mini" id="modalX">إغلاق</button></div></div></div>
  <footer class="credit" dir="ltr">By Zaher Alkablawi <span id="appVer"></span></footer>
</div>

<script>
/*CORE*/
</script>
<script>
(function(){
'use strict';
const VER = '1.6';
const TAG = 'UULA_AEQ'; // the same hidden tag UULA Arabic Math reads with «تعديل»
const $ = id => document.getElementById(id);
const say = (t, cls) => { const s = $('status'); s.textContent = t || ''; s.className = 'status' + (cls ? ' ' + cls : ''); };
const ICON = {
  ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  bad: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  skip: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>'
};
const svg = k => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Mazeri symbols (private-use characters) are hard to read in the list: show them as ◆
const show = s => s.replace(/[-]/g, '◆');

// ---- menu, about ----
const menu = open => { $('appMenu').hidden = !open; $('menuBtn').setAttribute('aria-expanded', String(!!open)); };
$('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu($('appMenu').hidden); });
document.addEventListener('click', e => { if (!e.target.closest('.appmenu')) menu(false); });
$('modalX').addEventListener('click', () => { $('modal').hidden = true; $('modalOk').hidden = true; });
// a question in the tool's own window (no browser dialogs)
function ask(title, html, okText){
  return new Promise(res => {
    $('modalT').textContent = title; $('modalB').innerHTML = html;
    const ok = $('modalOk'), x = $('modalX'); ok.textContent = okText || 'متابعة'; ok.hidden = false; $('modal').hidden = false;
    const done = v => { $('modal').hidden = true; ok.hidden = true; ok.onclick = x.onclick = null; res(v); };
    ok.onclick = () => done(true); x.onclick = () => done(false);
  });
}
$('aboutBtn').addEventListener('click', () => {
  menu(false);
  $('modalT').textContent = 'حول الأداة';
  $('modalB').innerHTML = '<p>تقرأ معادلات MathType القديمة في الشرائح، وتحفظ داخل كل واحدة كودها بصيغة <b>UULA Arabic Math</b>.</p>' +
    '<p>بعدها تحدد المعادلة القديمة وتضغط <b>تعديل</b> في UULA Arabic Math فيظهر كودها، ثم <b>إدراج</b> فتحل المعادلة الجديدة مكانها.</p>' +
    '<p><b>تحويل الأرقام إلى هندية</b>: يحوّل 0–9 إلى ٠–٩ في نص الشرائح فقط، ويترك رقم الصفحة والقالب والخلفية، والكلمات التي فيها حروف إنجليزية مثل fx-991.</p>' +
    '<p><b>إصلاح الأقواس المعكوسة</b>: في النص العربي يقلب الأقواس المكتوبة بالعكس مثل «)نص(»، ويضع بجانب كل قوس علامة اتجاه مخفية تمنع باوربوينت من قلبه. الأقواس حول الإنجليزي مثل f(x) تبقى كما هي.</p>' +
    '<p>المربعات التي فيها معادلات باوربوينت لا تُعدَّل مباشرة حتى لا تتفكك المعادلة: في الأرقام تُعاد بناء شريحتها (⌘Z قد لا يرجعها)، وفي الأقواس تُترك.</p>' +
    '<p><b>استبدل الكود إذا كان موجودًا من قبل</b>: بدونه تترك الأداة المعادلات التي أخذت كودها سابقًا.</p>' +
    '<p>⚠ تعني أن في المعادلة جزءًا لم يُعرف، وهو بين ⟦ ⟧ في الكود: راجعه قبل الإدراج.</p>' +
    '<p class="foot" dir="ltr">Developed by <b>Zaher Alkablawi</b> · Version ' + VER + '<br>© 2026 UULA. All rights reserved.</p>';
  $('modal').hidden = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ menu(false); $('modal').hidden = true; } });

// ---- scope ----
let scope = 'slide';
$('scope').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  scope = b.dataset.v; [...$('scope').children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); });

// ---- updates (same method as UULA Arabic Math) ----
(function(){
  const head = () => fetch('app.html?chk=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
    .then(r => r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null).catch(() => null);
  let base = null, last = 0;
  async function check(manual){
    last = Date.now(); const t = await head();
    if (!base){ base = t; if (manual) say(t ? 'لديك أحدث نسخة.' : 'لا يوجد اتصال.'); return; }
    if (t && t !== base){ $('updBtn').hidden = false; if (manual) say('يوجد تحديث جديد: اضغط زر التحديث.'); }
    else if (manual) say(t ? 'لديك أحدث نسخة.' : 'لا يوجد اتصال.');
  }
  head().then(t => { base = t; });
  setInterval(() => check(false), 60 * 60 * 1000);
  const soon = () => { if (Date.now() - last > 60 * 60 * 1000) check(false); };
  window.addEventListener('focus', soon);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) soon(); });
  $('updBtn').addEventListener('click', () => location.replace('app.html?v=' + Date.now()));
  $('chkUpd').addEventListener('click', () => { menu(false); check(true); });
})();

// ---- the presentation as bytes ----
function fileBytes(){
  return new Promise((res, rej) => {
    Office.context.document.getFileAsync(Office.FileType.Compressed, { sliceSize: 4194304 }, r => {
      if (r.status !== Office.AsyncResultStatus.Succeeded) return rej(new Error(r.error && r.error.message || 'getFile'));
      const f = r.value, n = f.sliceCount, parts = []; let got = 0;
      const done = () => { f.closeAsync(); const len = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(len); let o = 0; parts.forEach(p => { out.set(p, o); o += p.length; }); res(out); };
      for (let i = 0; i < n; i++) f.getSliceAsync(i, s => {
        if (s.status !== Office.AsyncResultStatus.Succeeded){ f.closeAsync(); return rej(new Error('slice')); }
        parts[i] = new Uint8Array(s.value.data); if (++got === n) done(); });
    });
  });
}

// a shape found in the file -> the same shape in PowerPoint (id first, then name and place)
function match(found, shapes){
  const near = s => Math.abs(s.left - found.left) + Math.abs(s.top - found.top) + Math.abs(s.width - found.width) + Math.abs(s.height - found.height);
  let m = shapes.find(s => String(s.id) === String(found.id) && near(s) < 12);
  if (!m) m = shapes.filter(s => s.name === found.name).sort((a, b) => near(a) - near(b))[0];
  if (m && near(m) > 12) m = null;
  if (!m){ const c = shapes.slice().sort((a, b) => near(a) - near(b))[0]; if (c && near(c) < 4) m = c; }
  return m || null;
}
const metaOf = f => encodeURIComponent(JSON.stringify({ v: 1, c: f.code, color: f.color || '#000000', align: 'right', pt: f.pt || 12, weight: '400', m: true, src: 'mathtype' }));

let results = [];
async function run(){
  if (!window.PowerPoint || !Office.context.requirements.isSetSupported('PowerPointApi', '1.5'))
    return say('تعمل الأداة في PowerPoint فقط (نسخة حديثة).', 'bad');
  const btn = $('go'); btn.disabled = true; $('goTxt').textContent = 'جارٍ القراءة…';
  const ico = btn.querySelector('svg'); const sp = document.createElement('span'); sp.className = 'spin'; ico.replaceWith(sp);
  say(''); $('list').innerHTML = ''; $('sum').innerHTML = '';
  try {
    // where to look
    const where = await PowerPoint.run(async ctx => {
      const slides = ctx.presentation.slides; slides.load('items/id');
      const sel = ctx.presentation.getSelectedSlides(); sel.load('items/id');
      const shp = ctx.presentation.getSelectedShapes(); shp.load('items/id');
      await ctx.sync();
      const ids = slides.items.map(s => s.id);
      return { ids, cur: sel.items.map(s => ids.indexOf(s.id)).filter(i => i >= 0), shapes: shp.items.map(s => s.id) };
    });
    if (scope !== 'all' && !where.cur.length) throw new Error('اختر شريحة أولًا.');
    if (scope === 'sel' && !where.shapes.length) throw new Error('حدد المعادلات القديمة أولًا.');
    const only = scope === 'all' ? null : (scope === 'sel' ? where.cur.slice(0, 1) : where.cur);
    const bytes = await fileBytes();
    $('goTxt').textContent = 'جارٍ إضافة الكود…';
    const found = await MTC.scan(bytes, only);
    const redo = $('redo').checked;
    results = [];
    await PowerPoint.run(async ctx => {
      const slides = ctx.presentation.slides; slides.load('items/id'); await ctx.sync();
      for (const s of found){
        if (!s.shapes.length) continue;
        const slide = slides.items[s.slide]; if (!slide) continue;
        const col = slide.shapes; col.load('items/id,items/name,items/left,items/top,items/width,items/height'); await ctx.sync();
        const shapes = col.items;
        for (const f of s.shapes){
          const r = { slide: s.slide, slideId: slide.id, f, sh: match(f, shapes) };
          results.push(r);
          if (scope === 'sel' && (!r.sh || !where.shapes.includes(r.sh.id))){ r.out = true; continue; }
          if (!r.sh){ r.state = 'bad'; r.msg = 'لم أجد الشكل في الشريحة'; continue; }
          if (f.error){ r.state = 'bad'; r.msg = f.error; continue; }
          if (f.empty){ r.state = 'skip'; r.msg = 'معادلة فارغة'; continue; }
          r.tag = r.sh.tags.getItemOrNullObject(TAG); r.tag.load('value');
        }
        await ctx.sync();
        for (const r of results){
          if (!r.tag || r.done) continue;
          r.done = true;
          if (!r.tag.isNullObject && !redo){ r.state = 'skip'; r.msg = 'فيها كود من قبل'; continue; }
          r.sh.tags.add(TAG, metaOf(r.f));
          r.state = r.f.warn && r.f.warn.length ? 'warn' : 'ok';
          if (r.state === 'warn') r.msg = 'راجع: ' + r.f.warn.join('، ');
        }
        await ctx.sync();
      }
    });
    results = results.filter(r => !r.out);
    draw();
  } catch (e){
    say(e && e.message && /[؀-ۿ]/.test(e.message) ? e.message : 'تعذّر العمل: ' + (e && e.message || e), 'bad');
  } finally {
    btn.disabled = false; $('goTxt').textContent = 'إضافة الكود'; sp.replaceWith(ico);
  }
}
$('go').addEventListener('click', run);

// ---------- English digits -> Hindi (Arabic-Indic) digits, in the slide's own text only ----------
const HINDI = '٠١٢٣٤٥٦٧٨٩';
const TEXT_TYPES = new Set(['GeometricShape','TextBox','Placeholder','Callout','Freeform']);
const SKIP_PH = new Set(['SlideNumber','Footer','Date']);
// same-length runs of digits to replace; digits inside a word with Latin letters (fx-991, MATH2) stay as they are
function digitRuns(t){
  const runs = []; const re = /\S+/g; let m;
  while ((m = re.exec(t))){
    if (/[A-Za-z]/.test(m[0])) continue;
    const d = /[0-9]+/g; let k;
    while ((k = d.exec(m[0]))) runs.push({ start: m.index + k.index, len: k[0].length, rep: k[0].replace(/[0-9]/g, c => HINDI[+c]) });
  }
  return runs;
}
// brackets in Arabic text: 1) written the wrong way round «)نص(» -> «(نص)»
// 2) written right but shown reversed (next to ∥, a digit, an overlined letter…): an invisible right-to-left mark (RLM) on each side fixes the direction
// brackets around English (f(x)) are left alone
const PAIRS = [['(', ')'], ['[', ']'], ['{', '}']];
const RLM = '‏', LAT = /[A-Za-z]/;
function parenRuns(t, flip){
  const edits = new Map(); // position -> { ch, mark, strip }
  let at = 0, k = -1;
  for (const para of t.split(/(\r\n|\r|\n)/)){
    const base = at; at += para.length;
    if (/^(\r\n|\r|\n)$/.test(para)) continue;
    k++;
    if (!/[؀-ۿ]/.test(para)) continue;
    const inv = flip && flip.has(k); // paragraph starts with an equation: store brackets reversed, no marks
    for (const [O, C] of PAIRS){
      const st = [], pairs = [];
      for (let i = 0; i < para.length; i++){
        const ch = para[i]; if (ch !== O && ch !== C) continue;
        const top = st[st.length - 1];
        if (ch === C){ if (top && top.k === 'n'){ st.pop(); pairs.push([top.i, i, false]); } else st.push({ i, k: 'r' }); }
        else { if (top && top.k === 'r'){ st.pop(); pairs.push([top.i, i, true]); } else st.push({ i, k: 'n' }); }
      }
      for (const [i, j, rev] of pairs){
        const latin = LAT.test(para.slice(i + 1, j)) || LAT.test(para[i - 1] || '');
        if (inv){ if (!latin){ edits.set(base + i, { ch: C, strip: true }); edits.set(base + j, { ch: O, strip: true }); } continue; }
        if (rev){ edits.set(base + i, { ch: O, mark: !latin }); edits.set(base + j, { ch: C, mark: !latin }); }
        else if (!latin){ edits.set(base + i, { ch: O, mark: true }); edits.set(base + j, { ch: C, mark: true }); }
      }
      if (!inv) for (const { i } of st){ const nb = (para[i - 1] || '') + (para[i + 1] || ''); if (!LAT.test(nb)) edits.set(base + i, { ch: para[i], mark: true }); }
    }
  }
  const runs = [];
  for (const [pos, e] of edits){
    if (e.strip){ // reversed bracket, and take away marks around it
      const l = t[pos - 1] === RLM ? 1 : 0, r = t[pos + 1] === RLM ? 1 : 0;
      if (e.ch === t[pos] && !l && !r) continue;
      runs.push({ start: pos - l, len: 1 + l + r, rep: e.ch }); continue;
    }
    const L = e.mark && t[pos - 1] !== RLM, R = e.mark && t[pos + 1] !== RLM;
    if (e.ch === t[pos] && !L && !R) continue; // already right
    runs.push({ start: pos, len: 1, rep: (L ? RLM : '') + e.ch + (R ? RLM : '') });
  }
  return runs.sort((x, y) => x.start - y.start);
}
// is this edit wholly inside plain text (not inside an equation) of its paragraph?
function insideText(t, r, math){
  let at = 0, k = -1;
  for (const part of t.split(/(\r\n|\r|\n)/)){
    const base = at; at += part.length;
    if (/^(\r\n|\r|\n)$/.test(part)) continue;
    k++;
    if (r.start >= base && r.start + r.len <= base + part.length){
      const pieces = math[k]; if (!pieces) return true;
      const sp = MTC.textSpans(part, pieces); if (!sp) return false;
      const s0 = r.start - base, s1 = s0 + r.len;
      return sp.some(([a, b]) => s0 >= a && s1 <= b);
    }
  }
  return false;
}
let slideH = null; // slide height in points (from the file), to recognise a page number at the bottom
async function getSlideH(){
  if (slideH) return slideH;
  try { const z = MTC.openZip(await fileBytes()); const p = await z.text('ppt/presentation.xml');
    const m = /<p:sldSz\b[^>]*\bcy="(\d+)"/.exec(p); if (m) slideH = +m[1] / 12700; } catch (e){}
  return slideH;
}
async function runFix(mode){
  const D = mode === 'digits';
  if (!window.PowerPoint || !Office.context.requirements.isSetSupported('PowerPointApi', '1.5'))
    return say('تعمل الأداة في PowerPoint فقط (نسخة حديثة).', 'bad');
  const btn = $(D ? 'digits' : 'parens'), lab = $(D ? 'digTxt' : 'parTxt'), num = btn.querySelector('.num'), label0 = lab.textContent;
  const find = D ? digitRuns : parenRuns, has = D ? (t => /[0-9]/.test(t)) : (t => /[()\[\]{}]/.test(t));
  const sp = document.createElement('span'); sp.className = 'spin';
  btn.disabled = true; num.replaceWith(sp); lab.textContent = D ? 'جارٍ التحويل…' : 'جارٍ الإصلاح…'; document.querySelectorAll('.go').forEach(b => b.disabled = true); say('');
  let nDig = 0, nShapes = 0, nTables = 0, nMath = 0, rebuilt = null;
  try {
    const H = await getSlideH();
    await PowerPoint.run(async ctx => {
      const P = ctx.presentation;
      const all = P.slides; all.load('items/id');
      const selS = P.getSelectedSlides(); selS.load('items/id');
      const selSh = P.getSelectedShapes(); selSh.load('items/id');
      await ctx.sync();
      let slides = scope === 'all' ? all.items : selS.items;
      if (!slides.length) throw new Error('اختر شريحة أولًا.');
      const pick = scope === 'sel' ? new Set(selSh.items.map(x => x.id)) : null;
      if (pick && !pick.size) throw new Error('حدد الأشكال أولًا.');
      if (pick) slides = slides.slice(0, 1);
      // every shape of the chosen slides, groups opened
      const leaves = [];
      const PROPS = 'items/id,items/type,items/name,items/top,items/height,items/left,items/width';
      let level = slides.map(sl => { const c = sl.shapes; c.load(PROPS); return { c, inPick: !pick, slide: sl.id }; });
      await ctx.sync();
      for (let depth = 0; level.length && depth < 6; depth++){
        const next = [];
        for (const { c, inPick, slide } of level) for (const sh of c.items){
          sh._slide = slide;
          const chosen = inPick || (pick && pick.has(sh.id));
          if (sh.type === 'Group'){ try { const g = sh.group.shapes; g.load(PROPS); next.push({ c: g, inPick: chosen, slide }); } catch (e){} continue; }
          if (chosen) leaves.push(sh);
        }
        try { await ctx.sync(); } catch (e){ break; }
        level = next;
      }
      // PowerPoint equations inside the text (from the file): never edit inside them
      {
        const idx = slides.map(sl => all.items.findIndex(x => x.id === sl.id));
        let info = []; try { info = await MTC.mathParas(await fileBytes(), idx); } catch (e){ info = null; }
        if (info === null) throw new Error('تعذّرت قراءة الملف، فلم أعدّل شيئًا حتى لا تتأثر المعادلات.');
        for (const si of info){
          const slideId = all.items[si.slide] && all.items[si.slide].id;
          for (const x of si.shapes){
            const near = sh => Math.abs(sh.left - x.left) + Math.abs(sh.top - x.top);
            const m = leaves.find(sh => sh._slide === slideId && String(sh.id) === String(x.id) && sh.name === x.name)
              || leaves.filter(sh => sh._slide === slideId && sh.name === x.name).sort((a, b) => near(a) - near(b))[0];
            if (m){ m._math = x.paras; m._flip = new Set(Object.keys(x.paras).filter(k => MTC.startsWithMath(x.paras[k])).map(Number)); }
          }
        }
      }
      // page number marks and footer placeholders
      const cand = leaves.filter(sh => TEXT_TYPES.has(sh.type) || sh.type === 'Table');
      for (const sh of cand){
        sh._num = sh.tags.getItemOrNullObject('MYNUMBER'); sh._num.load('value');
        if (sh.type === 'Placeholder'){ try { sh.placeholderFormat.load('type'); } catch (e){} }
      }
      await ctx.sync();
      const text = cand.filter(sh => sh.type !== 'Table' && (sh._num.isNullObject || !D) &&
        !(sh.type === 'Placeholder' && sh.placeholderFormat && SKIP_PH.has(sh.placeholderFormat.type)));
      // read the text (one by one if a shape has no text box)
      for (const sh of text){ sh._tr = sh.textFrame.textRange; sh._tr.load('text'); }
      try { await ctx.sync(); }
      catch (e){ for (const sh of text){ try { sh._tr = sh.textFrame.textRange; sh._tr.load('text'); await ctx.sync(); } catch (e2){ sh._tr = null; } } }
      for (const sh of text){
        if (!sh._tr) continue; let t; try { t = sh._tr.text; } catch (e){ continue; }
        if (!t || !has(t)) continue;
        // a lone number at the very bottom of the slide is the page number
        if (D && H && sh.top > H * 0.88 && /^[\s0-9\-—–|/.]*$/.test(t)) continue;
        if (sh._math){ nMath++; continue; } // a box with an equation: writing into it breaks the equation
        const runs = D ? find(t) : find(t, sh._flip);
        if (!runs.length) continue;
        for (const r of runs.slice().reverse()){ sh._tr.getSubstring(r.start, r.len).text = r.rep; nDig += D ? r.len : 1; } // from the end; each character keeps its formatting
        nShapes++;
      }
      await ctx.sync();
      // tables: cell by cell
      const tables = cand.filter(sh => sh.type === 'Table' && sh._num.isNullObject);
      for (const sh of tables){
        try {
          const tb = sh.getTable(); tb.load('rowCount,columnCount'); await ctx.sync();
          const cells = [];
          for (let r = 0; r < tb.rowCount; r++) for (let c = 0; c < tb.columnCount; c++){ const cl = tb.getCellOrNullObject(r, c); cl.load('text'); cells.push(cl); }
          await ctx.sync(); let hit = false;
          for (const cl of cells){ if (cl.isNullObject || !cl.text || !has(cl.text)) continue;
            const runs = find(cl.text); if (!runs.length) continue;
            let t = cl.text; for (const r of runs.slice().reverse()) t = t.slice(0, r.start) + r.rep + t.slice(r.start + r.len);
            cl.text = t; nDig += D ? runs.reduce((a, r) => a + r.len, 0) : runs.length; hit = true; }
          await ctx.sync(); if (hit) nTables++;
        } catch (e){}
      }
    });
    if (D) rebuilt = await rebuildMathSlides(lab);
    const where = nShapes + nTables;
    const W = scope === 'all' ? 'الملف' : scope === 'sel' ? 'المحدد' : 'الشريحة';
    if (D){
      const parts = [];
      if (nDig) parts.push('حُوّل ' + nDig + ' رقم في ' + where + ' من الأشكال');
      if (rebuilt && rebuilt.done) parts.push('و' + rebuilt.n + ' رقم في ' + rebuilt.done + ' من الشرائح فيها معادلات');
      if (rebuilt && rebuilt.failed) parts.push('تعذّرت ' + rebuilt.failed + ' من الشرائح');
      if (rebuilt && rebuilt.skipped) parts.push('لم تُعدَّل الشرائح التي فيها معادلات');
      say(parts.length ? parts.join('، ') + '.' : 'لا توجد أرقام إنجليزية في ' + W + '.', (nDig || (rebuilt && rebuilt.done)) ? 'ok' : '');
    }
    else say((nDig ? 'أُصلح ' + nDig + ' من الأقواس في ' + where + ' من الأشكال. (⌘Z للتراجع)' : 'لا توجد أقواس معكوسة يمكن إصلاحها في ' + W + '.') +
      (nMath ? ' تُركت ' + nMath + ' من الأشكال فيها معادلات.' : ''), nDig ? 'ok' : '');
  } catch (e){
    say(e && e.message && /[؀-ۿ]/.test(e.message) ? e.message : 'تعذّر التحويل: ' + (e && e.message || e), 'bad');
  } finally {
    document.querySelectorAll('.go').forEach(b => b.disabled = false); sp.replaceWith(num); lab.textContent = label0;
  }
}
$('digits').addEventListener('click', () => runFix('digits'));

// ---------- digits inside PowerPoint equations: the slide is rebuilt with Hindi digits in its equations ----------
const b64 = { from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  to: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); } };
async function rebuildMathSlides(lab){
  const where = await PowerPoint.run(async ctx => {
    const P = ctx.presentation, all = P.slides; all.load('items/id');
    const sel = P.getSelectedSlides(); sel.load('items/id'); await ctx.sync();
    const ids = all.items.map(x => x.id); return { cur: sel.items.map(x => ids.indexOf(x.id)).filter(i => i >= 0) };
  });
  const want = scope === 'all' ? null : (scope === 'sel' ? where.cur.slice(0, 1) : where.cur);
  const hits = (await MTC.slidesWithMathDigits(await fileBytes())).filter(i => !want || want.includes(i));
  if (!hits.length) return null;
  if (!Office.context.requirements.isSetSupported('PowerPointApi', '1.8')) return { skipped: true };
  const ok = await ask('شرائح فيها معادلات', '<p>في ' + hits.length + ' من الشرائح أرقام داخل مربعات فيها معادلات. لو عُدّلت مباشرة تتفكك المعادلات.</p>' +
    '<p>لذلك ستُنسخ كل شريحة منها بأرقام هندية (في النص والمعادلات)، ثم تحل النسخة مكان الأصلية. المحتوى والتنسيق والحركات تبقى كما هي، لكن <b>⌘Z قد لا يرجعها</b>.</p>', 'متابعة');
  if (!ok) return { skipped: true };
  let done = 0, n = 0, failed = 0;
  for (const idx of hits.slice().reverse()){ // from the end: the other indexes stay right
    lab.textContent = 'شريحة ' + (idx + 1) + '…';
    try {
      await PowerPoint.run(async ctx => {
        const all = ctx.presentation.slides; all.load('items/id'); await ctx.sync();
        const slide = all.items[idx]; const ex = slide.exportAsBase64(); await ctx.sync();
        const r = await MTC.slideMathDigits(b64.from(ex.value)); if (!r) return;
        ctx.presentation.insertSlidesFromBase64(b64.to(r.bytes), { formatting: 'UseDestinationTheme', targetSlideId: slide.id });
        await ctx.sync();
        all.load('items/id'); await ctx.sync();
        const fresh = all.items[idx + 1];
        if (!fresh || fresh.id === slide.id) throw new Error('insert');
        slide.delete(); await ctx.sync();
        done++; n += r.n;
      });
    } catch (e){ failed++; }
  }
  return { done, n, failed };
}

$('parens').addEventListener('click', () => runFix('parens'));

function draw(){
  const n = k => results.filter(r => r.state === k).length;
  const ok = n('ok'), warn = n('warn'), bad = n('bad'), skip = n('skip');
  if (!results.length){ say('لا توجد معادلات MathType هنا.'); return; }
  say(ok + warn ? 'أُضيف الكود إلى ' + (ok + warn) + ' معادلة.' : 'لم يُضف كود جديد.', ok + warn ? 'ok' : '');
  $('sum').innerHTML = (ok ? '<span class="pill ok">✓ ' + ok + '</span>' : '') + (warn ? '<span class="pill warn">راجع ' + warn + '</span>' : '') +
    (bad ? '<span class="pill bad">تعذّر ' + bad + '</span>' : '') + (skip ? '<span class="pill">تُركت ' + skip + '</span>' : '');
  const L = $('list'); L.innerHTML = '';
  results.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'row ' + r.state; d.dataset.i = i;
    const code = r.f.code ? show(r.f.code) : '';
    d.innerHTML = svg(r.state) + '<div><div class="code">' + esc(code || '—') + '</div>' +
      '<div class="meta">شريحة ' + (r.slide + 1) + (r.f.pt ? ' · ' + r.f.pt + ' pt' : '') + '</div>' +
      (r.msg ? '<div class="note">' + esc(r.msg) + '</div>' : '') + '</div>' +
      (r.f.empty && r.sh ? '<button type="button" class="mini del" data-del="' + i + '">حذف</button>' : '<span></span>');
    L.appendChild(d);
  });
}
// click a row: go to that equation and select it
$('list').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  const row = e.target.closest('.row'); if (!row) return;
  const r = results[+row.dataset.i]; if (!r || !r.sh) return;
  if (del){ // an empty MathType object: nothing to rewrite, so it can go
    try { await PowerPoint.run(async ctx => { ctx.presentation.slides.getItem(r.slideId).shapes.getItem(r.sh.id).delete(); await ctx.sync(); });
      r.state = 'skip'; r.msg = 'حُذفت'; r.sh = null; draw(); } catch (err){ say('تعذّر الحذف.', 'bad'); }
    return;
  }
  try { await PowerPoint.run(async ctx => {
    const P = ctx.presentation;
    if (P.setSelectedSlides) P.setSelectedSlides([r.slideId]);
    await ctx.sync();
    if (P.setSelectedShapes) P.setSelectedShapes([r.sh.id]);
    await ctx.sync(); }); }
  catch (err){ Office.context.document.goToByIdAsync(r.slide + 1, Office.GoToType.Index, () => {}); }
});

$('appVer').textContent = VER;
if (window.Office && Office.onReady) Office.onReady(() => {});
})();
