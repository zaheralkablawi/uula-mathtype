<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#18212e;--muted:#5d6878;--line:#d9dfe7;--accent:#1f71de;--accent-soft:#e7effc;--ok:#1f9d55;--warn:#e8590c;--bad:#d62f2f;
  --f:"UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
button{font-family:inherit}
.wrap{padding:10px 14px 16px;display:grid;gap:10px}
header{display:flex;align-items:center;gap:8px;direction:rtl;padding-inline:13px}
h1{margin:0;display:flex;align-items:center;gap:7px;font-weight:500;direction:ltr;margin-left:auto}
h1 .bt{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;height:30px}
h1 .root{color:#2072e0;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
h1 .sub{color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ib.updbtn{position:relative;color:#e8590c;border-color:#e8590c}
.updbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:#e8590c;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{50%{transform:scale(1.5);opacity:.5}}
.appmenu{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);padding:5px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;font-size:12.5px;text-align:start;background:none;border:0;border-radius:7px;padding:6px 10px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.menu svg{width:15px;height:15px;flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-size:12.5px;height:26px;border:0;border-inline-start:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;padding:0 4px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.go:hover{filter:brightness(1.07)}.go:disabled{opacity:.55;cursor:default}
.go.alt{background:var(--panel);color:var(--accent);border:1.5px solid var(--accent)}
.go.alt:hover{background:var(--accent-soft);filter:none}
.go.alt .spin{border-color:rgb(31 113 222 / .3);border-top-color:var(--accent)}
.go .num{font-size:15px;font-weight:600;line-height:1}
.sep{height:1px;background:var(--line);margin:2px 0}
.note{font-size:11.8px;color:var(--muted);text-align:center;margin-top:-4px}
.go svg{width:18px;height:18px}
.status{font-size:12.8px;color:var(--muted);min-height:1.2em;text-align:center}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{font-size:11.8px;border-radius:20px;padding:1px 9px;background:#eef1f5;color:var(--muted)}
.pill.ok{background:#e4f5ea;color:var(--ok)}.pill.warn{background:#fdeee4;color:var(--warn)}.pill.bad{background:#fbe5e5;color:var(--bad)}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .ic{width:18px;height:18px;margin-top:2px}
.row .code{font-size:13px;white-space:pre-wrap;word-break:break-word;direction:rtl;unicode-bidi:plaintext}
.row .meta{font-size:11px;color:var(--muted)}
.row .note{font-size:11.5px;color:var(--warn)}
.row.ok .ic{color:var(--ok)}.row.warn .ic{color:var(--warn)}.row.bad .ic{color:var(--bad)}.row.skip .ic{color:#9aa3b0}
.mini{font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:6px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.mini.del{color:var(--bad)}
.hint{font-size:11.8px;color:var(--muted);text-align:center;line-height:1.7}
.hint b{color:var(--ink);font-weight:600}
.modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 40px rgb(0 0 0 / .3)}
.mbox h3{margin:0 0 8px;font-size:1rem}.mbox p{margin:6px 0;font-size:13px}
.mbox .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.credit{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 0}
.spin{width:16px;height:16px;border:2px solid rgb(255 255 255 / .45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
  <header>
    <h1><img src="logo.png" alt="" width="30" height="30" style="display:block;flex:none"><span class="bt"><span class="root">UULA</span><span class="sub">MathType Code</span></span></h1>
    <button type="button" class="ib updbtn" id="updBtn" hidden title="تحديث جديد"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"/><path d="M20 20v-5h-5"/></svg><span class="dot"></span></button>

  <div class="panel">

    <div class="sep"></div>
    <button type="button" class="go alt" id="digits"><span class="num">١٢٣</span><span id="digTxt">تحويل الأرقام إلى هندية</span></button>
    <button type="button" class="go alt" id="parens"><span class="num">( )</span><span id="parTxt">إصلاح الأقواس المعكوسة</span></button>

  <div class="hint" id="hint">بعد إضافة الكود: حدد المعادلة القديمة، ثم اضغط <b>تعديل</b> في <b>UULA Arabic Math</b>، ثم <b>إدراج</b>.</div>

  <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="mini" id="modalOk" hidden>متابعة</button><button type="button" class="mini" id="modalX">إغلاق</button></div></div></div>

<script>
// UULA MathType Code — reading engine
// pptx bytes -> MathType objects on each slide -> UULA Arabic Math text (+ color, size)
const MTC = (() => {
'use strict';

// ---------- zip ----------
async function inflateRaw(u8){
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
function openZip(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('ليس ملف باوربوينت صالحًا');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const files = {}, td = new TextDecoder();
  for (let i = 0; i < n; i++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = { method, csize, off };
    p += 46 + nl + xl + cl;
  }
  const cache = {};
  async function bytes(name){
    const f = files[name]; if (!f) return null;
    if (cache[name]) return cache[name];
    const lnl = dv.getUint16(f.off + 26, true), lxl = dv.getUint16(f.off + 28, true);
    const raw = u8.subarray(f.off + 30 + lnl + lxl, f.off + 30 + lnl + lxl + f.csize);
    return (cache[name] = f.method === 0 ? raw : await inflateRaw(raw));
  }
  async function text(name){ const b = await bytes(name); return b ? new TextDecoder().decode(b) : null; }
  return { files, bytes, text };
}

// ---------- OLE compound file ----------
function cfbStream(u8, want){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const u32 = o => dv.getUint32(o, true);
  if (u32(0) !== 0xE011CFD0) return null;
  const ss = 1 << dv.getUint16(30, true), mss = 1 << dv.getUint16(32, true);
  const dirStart = u32(48), miniCut = u32(56), miniFatStart = u32(60);
  const nDifatSec = u32(72); let difatSec = u32(68);
  const secOff = s => 512 + s * ss;
  const difat = [];
  for (let i = 0; i < 109; i++) difat.push(u32(76 + i * 4));
  for (let k = 0; k < nDifatSec && difatSec < 0xFFFFFFFA; k++){
    for (let i = 0; i < ss / 4 - 1; i++) difat.push(u32(secOff(difatSec) + i * 4));
    difatSec = u32(secOff(difatSec) + ss - 4);
  }
  const fat = [];
  for (const d of difat){ if (d >= 0xFFFFFFFA) continue; for (let i = 0; i < ss / 4; i++) fat.push(u32(secOff(d) + i * 4)); }
  const read = s => { const parts = []; let guard = 0;
    while (s < 0xFFFFFFFA && guard++ < 1e6){ parts.push(u8.subarray(secOff(s), secOff(s) + ss)); s = fat[s]; }
    const out = new Uint8Array(parts.length * ss); parts.forEach((p, i) => out.set(p, i * ss)); return out; };
  const dir = read(dirStart), ddv = new DataView(dir.buffer);
  let root = null, hit = null;
  for (let i = 0; i < dir.length / 128; i++){
    const o = i * 128, nl = ddv.getUint16(o + 64, true);
    let nm = ''; for (let k = 0; k < Math.max(nl - 2, 0); k += 2) nm += String.fromCharCode(ddv.getUint16(o + k, true));
    const ent = { nm, start: ddv.getUint32(o + 116, true), size: ddv.getUint32(o + 120, true) };
    if (i === 0) root = ent;
    if (nm === want) hit = ent;
  }
  if (!hit) return null;
  if (hit.size >= miniCut) return read(hit.start).subarray(0, hit.size);
  const mini = read(root.start), mf = read(miniFatStart), mfv = new DataView(mf.buffer);
  const out = new Uint8Array(hit.size); let s = hit.start, w = 0, guard = 0;
  while (s < 0xFFFFFFFA && w < hit.size && guard++ < 1e6){
    const take = Math.min(mss, hit.size - w); out.set(mini.subarray(s * mss, s * mss + take), w); w += take;
    s = mfv.getUint32(s * 4, true);
  }
  return out;
}

// ---------- MTEF v5 ----------
const TMPL = ['angle','paren','brace','brack','bar','dbar','floor','ceil','obrack','interval','root','frac','ubar','obar',
  'arrow','integ','sum','prod','coprod','union','inter','intop','sumop','lim','hbrace','hbrack','ldiv','sub','sup','subsup',
  'dirac','vec','tilde','hat','arc','jstatus','strike','box'];
function parseMTEF(d){
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  let p = dv.getUint16(0, true);
  const u8 = () => d[p++], u16 = () => { const v = dv.getUint16(p, true); p += 2; return v; };
  const cstr = () => { let s = ''; while (p < d.length && d[p]) s += String.fromCharCode(d[p++]); p++; return s; };
  const ver = u8(); if (ver !== 5) throw new Error('MTEF' + ver);
  u8(); u8(); u8(); u8(); cstr(); u8();
  const fonts = [], styles = [], colors = []; let fullPt = null, curColor = null;
  const nudge = () => { const a = u8(), b = u8(); if (a === 128 && b === 128){ u16(); u16(); } };
  const ruler = () => { const n = u8(); for (let i = 0; i < n; i++){ u8(); u16(); } };
  const dims = n => { const vals = []; let half = null;
    const nib = () => { if (half === null){ const v = u8(); half = v & 15; return v >> 4; } const v = half; half = null; return v; };
    for (let i = 0; i < n; i++){ const unit = nib(); let s = ''; for (;;){ const x = nib(); if (x === 15) break; s += x < 10 ? x : x === 10 ? '.' : '-'; } vals.push({ unit, v: parseFloat(s) }); }
    return vals; };
  function list(){ const out = []; while (p < d.length){ const t = u8(); if (t === 0) return out; const o = rec(t); if (o) out.push(o); } return out; }
  function rec(t){
    switch (t){
      case 1: { const o = u8(); if (o & 8) nudge(); if (o & 4) u16(); if (o & 2) ruler(); return { k: 'line', c: (o & 1) ? [] : list() }; }
      case 2: { const o = u8(); if (o & 8) nudge(); const tf = u8() - 128; let mt = null, fp = null;
        if (!(o & 0x20)) mt = u16(); if (o & 0x04) fp = u8(); if (o & 0x10) fp = u16();
        const color = curColor; const emb = (o & 0x01) ? list() : [];
        return { k: 'char', mt, tf, fp, emb, color }; }
      case 3: { const o = u8(); if (o & 8) nudge(); const sel = u8(); let v = u8(); if (v & 0x80) v = (v & 0x7F) | (u8() << 7); u8();
        return { k: 'tmpl', t: TMPL[sel] || ('t' + sel), v, c: list() }; }
      case 4: { const o = u8(); if (o & 8) nudge(); u8(); u8(); if (o & 2) ruler(); return { k: 'pile', c: list() }; }
      case 5: { const o = u8(); if (o & 8) nudge(); u8(); u8(); u8(); const rows = u8(), cols = u8();
        p += Math.ceil((rows + 1) * 2 / 8) + Math.ceil((cols + 1) * 2 / 8); return { k: 'matrix', rows, cols, c: list() }; }
      case 6: { const o = u8(); if (o & 8) nudge(); return { k: 'embell', e: u8() }; }
      case 7: ruler(); return null;
      case 8: u8(); u8(); return null;
      case 9: { const b = u8(); if (b === 101) u16(); else if (b === 100){ u8(); u16(); } else u8(); return null; }
      case 10: case 11: case 12: case 13: case 14: return null;
      case 15: { const i = u8(); curColor = i > 0 ? (colors[i - 1] || null) : null; return null; } // 1-based, 0 = black
      case 16: { const o = u8(); const vals = []; const n = (o & 1) ? 4 : 3; for (let i = 0; i < n; i++) vals.push(u16());
        if (o & 4) cstr();
        let rgb = vals; if (n === 4){ const [c, m, y, k] = vals.map(x => x / 1000); rgb = [(1 - c) * (1 - k), (1 - m) * (1 - k), (1 - y) * (1 - k)].map(x => x * 1000); }
        colors.push('#' + rgb.map(x => Math.round(Math.min(1000, x) / 1000 * 255).toString(16).padStart(2, '0')).join(''));
        return null; }
      case 17: u8(); fonts.push(cstr()); return null;
      case 18: { u8(); let n = u8(); const sz = dims(n); n = u8(); dims(n); n = u8();
        for (let i = 0; i < n; i++){ const fd = u8(); if (fd) u8(); styles.push(fd); }
        if (sz[0]){ const { unit, v } = sz[0]; fullPt = unit === 2 ? v : unit === 0 ? v * 72 : unit === 1 ? v * 72 / 2.54 : unit === 3 ? v * 12 : null; }
        return null; }
      case 19: cstr(); return null;
      default:
        if (t >= 100){ const n = u16(); p += n; return null; }
        throw new Error('tag ' + t);
    }
  }
  const tree = list();
  return { tree, fonts, styles, fullPt };
}

// ---------- MTEF (visual, left to right) -> UULA Arabic Math (logical, right to left) ----------
// Mazeri "normal arabic letters": typed on Latin keys with the Arabic keyboard layout
const KB = {q:'ض',w:'ص',e:'ث',r:'ق',t:'ف',y:'غ',u:'ع',i:'ه',o:'خ',p:'ح','[':'ج',']':'د',a:'ش',s:'س',d:'ي',f:'ب',g:'ل',
  h:'أ',j:'ت',k:'ن',l:'م',';':'ك',"'":'ط',z:'ئ',x:'ء',c:'ؤ',v:'ر',n:'ى',m:'ة','`':'ذ',H:'أ',Y:'إ',N:'آ',b:'لا'};
// Mazeri Arabic Math symbol: letter positions (same table as UULA Arabic Math)
const MATHLETTER_POS = {0x41:'أ',0x42:'ب',0x43:'ت',0x44:'ث',0x45:'ج',0x48:'ح',0x47:'خ',0x49:'د',0x4E:'ذ',0x4B:'ر',0x4D:'ز',0x4F:'س',
  0x50:'ش',0x51:'ص',0x52:'ض',0x53:'ط',0x54:'ظ',0x55:'ع',0x56:'غ',0x57:'ف',0x58:'ق',0x59:'ك',0x5A:'ل',0x5C:'م',0x5D:'ن',0x60:'ه',
  0x61:'و',0x62:'ي',0x4A:'ء'};
// characters UULA Arabic Math draws mirrored: written the other way in logical text
const MIRROR = {'<':'>','>':'<','≤':'≥','≥':'≤','∈':'∋','∋':'∈','∉':'∌','∌':'∉','⊂':'⊃','⊃':'⊂','⊆':'⊇','⊇':'⊆','⊄':'⊅','⊅':'⊄',
  '(':')',')':'(','[':']',']':'[','«':'»','»':'«'};
const AR = '٠١٢٣٤٥٦٧٨٩';
const OPS = new Set(['=','≠','≈','≅','≡','×','÷','+','-','−','±','∓','<','>','≤','≥','∈','∉','⊂','⊃','⊆','⊇','∩','∪','←','→','⟸','⟹','⟺','∴','∵',':','،']);

// a color close to one of the booklet colors becomes that color
const BOOK = ['#000000','#ffffff','#1f71de','#fe00fe','#ffe600'];
function snap(c){
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const a = rgb(c); let best = c, bd = 40;
  for (const b of BOOK){ const d = Math.max(...rgb(b).map((v, i) => Math.abs(v - a[i]))); if (d < bd){ bd = d; best = b; } }
  return best;
}
function convert(eq){
  const { tree, fonts, styles } = eq;
  const warn = [];
  const colorCount = {};
  const fontOf = tf => { if (tf < 0) return fonts[-tf - 1] || ''; const fd = styles[tf - 1]; return fd ? (fonts[fd - 1] || '') : ''; };
  // first pass: count colors to find the main one
  (function walk(list){ for (const o of list){ if (o.k === 'char' && o.mt != null && o.mt !== 0xF700){ const c = o.color || '#000000'; colorCount[c] = (colorCount[c] || 0) + 1; }
    if (o.c) walk(o.c); if (o.emb) walk(o.emb); } })(tree);
  const main = Object.entries(colorCount).sort((a, b) => b[1] - a[1])[0];

function fileBytes(){

    Office.context.document.getFileAsync(Office.FileType.Compressed, { sliceSize: 4194304 }, r => {
      if (r.status !== Office.AsyncResultStatus.Succeeded) return rej(new Error(r.error && r.error.message || 'getFile'));
      const f = r.value, n = f.sliceCount, parts = []; let got = 0;
      const done = () => { f.closeAsync(); const len = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(len); let o = 0; parts.forEach(p => { out.set(p, o); o += p.length; }); res(out); };
      for (let i = 0; i < n; i++) f.getSliceAsync(i, s => {
        if (s.status !== Office.AsyncResultStatus.Succeeded){ f.closeAsync(); return rej(new Error('slice')); }
        parts[i] = new Uint8Array(s.value.data); if (++got === n) done(); });
    });
  });
}

// a shape found in the file -> the same shape in PowerPoint (id first, then name and place)
function match(found, shapes){
  const near = s => Math.abs(s.left - found.left) + Math.abs(s.top - found.top) + Math.abs(s.width - found.width) + Math.abs(s.height - found.height);
  let m = shapes.find(s => String(s.id) === String(found.id) && near(s) < 12);
  if (!m) m = shapes.filter(s => s.name === found.name).sort((a, b) => near(a) - near(b))[0];
  if (m && near(m) > 12) m = null;
  if (!m){ const c = shapes.slice().sort((a, b) => near(a) - near(b))[0]; if (c && near(c) < 4) m = c; }
  return m || null;
}

function digitRuns(t){
  const runs = []; const re = /\S+/g; let m;

    if (/[A-Za-z]/.test(m[0])) continue;
    const d = /[0-9]+/g; let k;
    while ((k = d.exec(m[0]))) runs.push({ start: m.index + k.index, len: k[0].length, rep: k[0].replace(/[0-9]/g, c => HINDI[+c]) });

// brackets in Arabic text: 1) written the wrong way round «)نص(» -> «(نص)»
// 2) written right but shown reversed (next to ∥, a digit, an overlined letter…): an invisible right-to-left mark (RLM) on each side fixes the direction
// brackets around English (f(x)) are left alone
const PAIRS = [['(', ')'], ['[', ']'], ['{', '}']];
const RLM = '‏', LAT = /[A-Za-z]/;
function parenRuns(t, flip){
  const edits = new Map(); // position -> { ch, mark, strip }
  let at = 0, k = -1;
  for (const para of t.split(/(\r\n|\r|\n)/)){
    const base = at; at += para.length;
    if (/^(\r\n|\r|\n)$/.test(para)) continue;
    k++;
    if (!/[؀-ۿ]/.test(para)) continue;
    const inv = flip && flip.has(k); // paragraph starts with an equation: store brackets reversed, no marks
    for (const [O, C] of PAIRS){
      const st = [], pairs = [];
      for (let i = 0; i < para.length; i++){
        const ch = para[i]; if (ch !== O && ch !== C) continue;
        const top = st[st.length - 1];
        if (ch === C){ if (top && top.k === 'n'){ st.pop(); pairs.push([top.i, i, false]); } else st.push({ i, k: 'r' }); }
        else { if (top && top.k === 'r'){ st.pop(); pairs.push([top.i, i, true]); } else st.push({ i, k: 'n' }); }
      }
      for (const [i, j, rev] of pairs){
        const latin = LAT.test(para.slice(i + 1, j)) || LAT.test(para[i - 1] || '');
        if (inv){ if (!latin){ edits.set(base + i, { ch: C, strip: true }); edits.set(base + j, { ch: O, strip: true }); } continue; }
        if (rev){ edits.set(base + i, { ch: O, mark: !latin }); edits.set(base + j, { ch: C, mark: !latin }); }
        else if (!latin){ edits.set(base + i, { ch: O, mark: true }); edits.set(base + j, { ch: C, mark: true }); }
      }
      if (!inv) for (const { i } of st){ const nb = (para[i - 1] || '') + (para[i + 1] || ''); if (!LAT.test(nb)) edits.set(base + i, { ch: para[i], mark: true }); }
    }
  }
  const runs = [];
  for (const [pos, e] of edits){
    if (e.strip){ // reversed bracket, and take away marks around it
      const l = t[pos - 1] === RLM ? 1 : 0, r = t[pos + 1] === RLM ? 1 : 0;
      if (e.ch === t[pos] && !l && !r) continue;
      runs.push({ start: pos - l, len: 1 + l + r, rep: e.ch }); continue;
    }
    const L = e.mark && t[pos - 1] !== RLM, R = e.mark && t[pos + 1] !== RLM;
    if (e.ch === t[pos] && !L && !R) continue; // already right
    runs.push({ start: pos, len: 1, rep: (L ? RLM : '') + e.ch + (R ? RLM : '') });
  }
  return runs.sort((x, y) => x.start - y.start);
}
// is this edit wholly inside plain text (not inside an equation) of its paragraph?
function insideText(t, r, math){
  let at = 0, k = -1;
  for (const part of t.split(/(\r\n|\r|\n)/)){
    const base = at; at += part.length;
    if (/^(\r\n|\r|\n)$/.test(part)) continue;
    k++;
    if (r.start >= base && r.start + r.len <= base + part.length){
      const pieces = math[k]; if (!pieces) return true;
      const sp = MTC.textSpans(part, pieces); if (!sp) return false;
      const s0 = r.start - base, s1 = s0 + r.len;
      return sp.some(([a, b]) => s0 >= a && s1 <= b);
    }
  }
  return false;
}

    '<p>لذلك ستُنسخ كل شريحة منها بأرقام هندية (في النص والمعادلات)، ثم تحل النسخة مكان الأصلية. المحتوى والتنسيق والحركات تبقى كما هي، لكن <b>⌘Z قد لا يرجعها</b>.</p>', 'متابعة');
  if (!ok) return { skipped: true };
  let done = 0, n = 0, failed = 0;
  for (const idx of hits.slice().reverse()){ // from the end: the other indexes stay right
    lab.textContent = 'شريحة ' + (idx + 1) + '…';
    try {
      await PowerPoint.run(async ctx => {
        const all = ctx.presentation.slides; all.load('items/id'); await ctx.sync();
        const slide = all.items[idx]; const ex = slide.exportAsBase64(); await ctx.sync();
        const r = await MTC.slideMathDigits(b64.from(ex.value)); if (!r) return;
        ctx.presentation.insertSlidesFromBase64(b64.to(r.bytes), { formatting: 'UseDestinationTheme', targetSlideId: slide.id });
        await ctx.sync();
        all.load('items/id'); await ctx.sync();
        const fresh = all.items[idx + 1];
        if (!fresh || fresh.id === slide.id) throw new Error('insert');
        slide.delete(); await ctx.sync();
        done++; n += r.n;
      });
    } catch (e){ failed++; }
  }
  return { done, n, failed };
}

$('parens').addEventListener('click', () => runFix('parens'));

function draw(){
  const n = k => results.filter(r => r.state === k).length;
  const ok = n('ok'), warn = n('warn'), bad = n('bad'), skip = n('skip');
  if (!results.length){ say('لا توجد معادلات MathType هنا.'); return; }
  say(ok + warn ? 'أُضيف الكود إلى ' + (ok + warn) + ' معادلة.' : 'لم يُضف كود جديد.', ok + warn ? 'ok' : '');
  $('sum').innerHTML = (ok ? '<span class="pill ok">✓ ' + ok + '</span>' : '') + (warn ? '<span class="pill warn">راجع ' + warn + '</span>' : '') +
    (bad ? '<span class="pill bad">تعذّر ' + bad + '</span>' : '') + (skip ? '<span class="pill">تُركت ' + skip + '</span>' : '');
  const L = $('list'); L.innerHTML = '';
  results.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'row ' + r.state; d.dataset.i = i;
    const code = r.f.code ? show(r.f.code) : '';
    d.innerHTML = svg(r.state) + '<div><div class="code">' + esc(code || '—') + '</div>' +
      '<div class="meta">شريحة ' + (r.slide + 1) + (r.f.pt ? ' · ' + r.f.pt + ' pt' : '') + '</div>' +
      (r.msg ? '<div class="note">' + esc(r.msg) + '</div>' : '') + '</div>' +
      (r.f.empty && r.sh ? '<button type="button" class="mini del" data-del="' + i + '">حذف</button>' : '<span></span>');
    L.appendChild(d);
  });
}
// click a row: go to that equation and select it
$('list').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  const row = e.target.closest('.row'); if (!row) return;
  const r = results[+row.dataset.i]; if (!r || !r.sh) return;
  if (del){ // an empty MathType object: nothing to rewrite, so it can go
    try { await PowerPoint.run(async ctx => { ctx.presentation.slides.getItem(r.slideId).shapes.getItem(r.sh.id).delete(); await ctx.sync(); });
      r.state = 'skip'; r.msg = 'حُذفت'; r.sh = null; draw(); } catch (err){ say('تعذّر الحذف.', 'bad'); }
    return;
  }
  try { await PowerPoint.run(async ctx => {
    const P = ctx.presentation;
    if (P.setSelectedSlides) P.setSelectedSlides([r.slideId]);
    await ctx.sync();
    if (P.setSelectedShapes) P.setSelectedShapes([r.sh.id]);
    await ctx.sync(); }); }
  catch (err){ Office.context.document.goToByIdAsync(r.slide + 1, Office.GoToType.Index, () => {}); }
});

$('appVer').textContent = VER;
if (window.Office && Office.onReady) Office.onReady(() => {});
})();
